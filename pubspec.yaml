name: booru_aggregator
description: A premium multi-booru image aggregator with Apple-level aesthetics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.8.1

  # Image Handling
  cached_network_image: ^3.3.1
  extended_image: ^8.2.0
  photo_view: ^0.14.0
  flutter_staggered_grid_view: ^0.7.0

  # Video
  video_player: ^2.8.2
  chewie: ^1.7.4

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0
  animations: ^2.0.11
  modal_bottom_sheet: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  liquid_progress_indicator_v2: ^0.5.0

  # Utils
  get_it: ^7.6.7
  injectable: ^2.3.2
  freezed_annotation: ^2.4.1
  dartz: ^0.10.1
  rxdart: ^0.27.7
  connectivity_plus: ^6.0.1
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  image_gallery_saver: ^2.0.3
  haptic_feedback: ^0.1.0+2
  flutter_keyboard_visibility: ^5.4.1
  infinite_scroll_pagination: ^4.0.0
  pull_to_refresh: ^2.0.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  intl: ^0.19.0
  timeago: ^3.6.0
  crypto: ^3.0.3
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  injectable_generator: ^2.4.3
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
