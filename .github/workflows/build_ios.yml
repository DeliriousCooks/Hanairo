name: Build & Sign iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Signed IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: '3.47.1'
      KEYCHAIN_NAME: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure iOS platform files exist
        run: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ios/Runner.xcodeproj is missing from the repo — regenerating iOS platform files with 'flutter create'."
            echo "This will NOT overwrite files that already exist (like your customized Info.plist)."
            flutter create --platforms=ios --project-name booru_aggregator --org app.starfruit8199 .
          fi
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "::error::ios/Runner.xcodeproj/project.pbxproj still missing after 'flutter create'. Aborting."
            exit 1
          fi

      - name: Decode P12
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > /tmp/cert.p12
          echo "P12 size: $(wc -c < /tmp/cert.p12) bytes"

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          echo "Profile size: $(wc -c < /tmp/profile.mobileprovision) bytes"

      - name: Create keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_NAME"

      - name: Import P12 certificate
        run: |
          echo "P12 size: $(wc -c < /tmp/cert.p12) bytes"

          # Step 1: extract cert + key to unencrypted PEM
          # try -legacy first (for older P12 formats), fall back to default
          if ! openssl pkcs12 \
              -in /tmp/cert.p12 \
              -passin pass:${{ secrets.P12_PASSWORD }} \
              -nodes -out /tmp/cert_and_key.pem -legacy 2>/dev/null; then
            openssl pkcs12 \
              -in /tmp/cert.p12 \
              -passin pass:${{ secrets.P12_PASSWORD }} \
              -nodes -out /tmp/cert_and_key.pem
          fi

          echo "PEM size: $(wc -c < /tmp/cert_and_key.pem) bytes"

          # Step 2: re-pack into a fresh P12 with a known-safe password
          openssl pkcs12 \
            -in /tmp/cert_and_key.pem \
            -passin pass: \
            -export \
            -passout pass:TempCert999 \
            -out /tmp/cert_final.p12

          echo "Final P12 size: $(wc -c < /tmp/cert_final.p12) bytes"

          # Step 3: import into keychain
          security import /tmp/cert_final.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "TempCert999" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"

          # Should show: iPhone Distribution: qa ba (SE4UL3VJW5)
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"

          # Extract the identity string (between quotes on the first match) instead of
          # hardcoding it, since it depends on whichever cert is in the P12 secret.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" \
            | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+[0-9A-F]+[[:space:]]+"(.*)"$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Could not find a valid codesigning identity in the keychain after import."
            exit 1
          fi
          echo "Codesign identity: $IDENTITY"
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        run: |
          PP_UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -o - -)
          TEAM_ID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract TeamIdentifier.0 raw -o - -)
          BUNDLE_ID_RAW=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract Entitlements.application-identifier raw -o - -)
          # application-identifier is "TEAMID.bundle.id" - strip the "TEAMID." prefix
          BUNDLE_ID="${BUNDLE_ID_RAW#${TEAM_ID}.}"
          PROFILE_NAME=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract Name raw -o - -)

          echo "Profile UUID: $PP_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Profile name: $PROFILE_NAME"

          if [ -z "$PP_UUID" ] || [ -z "$TEAM_ID" ] || [ -z "$BUNDLE_ID" ]; then
            echo "::error::Failed to extract one or more required values from the provisioning profile."
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

          # Make these available to later steps instead of hardcoding them
          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Configure Xcode signing
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path) as f:
              content = f.read()

          def required_env(name):
              val = os.environ.get(name, "")
              if not val:
                  raise SystemExit(f"Missing required env var {name} - an earlier step should have set it.")
              return val

          bundle_id = required_env("BUNDLE_ID")
          team_id = required_env("TEAM_ID")
          pp_uuid = required_env("PP_UUID")
          identity = required_env("CODE_SIGN_IDENTITY")

          settings = {
              "PRODUCT_BUNDLE_IDENTIFIER": bundle_id,
              "DEVELOPMENT_TEAM": team_id,
              "CODE_SIGN_STYLE": "Manual",
              "PROVISIONING_PROFILE_SPECIFIER": f'"{pp_uuid}"',
              "CODE_SIGN_IDENTITY": f'"{identity}"',
          }

          def patch_block(match):
              block = match.group(0)
              for key, val in settings.items():
                  pattern = re.compile(rf"{key} = [^;]*;")
                  if pattern.search(block):
                      block = pattern.sub(f"{key} = {val};", block)
                  else:
                      block = re.sub(
                          r"(buildSettings = \{\n)",
                          rf"\1\t\t\t\t{key} = {val};\n",
                          block,
                          count=1,
                      )
              return block

          content = re.sub(r"buildSettings = \{[^}]*\};", patch_block, content, flags=re.S)

          with open(path, "w") as f:
              f.write(content)

          print("Xcode project patched with values read from the actual cert/profile:")
          for k, v in settings.items():
              print(f"  {k} = {v}")
          PYEOF

      - name: Flutter build iOS
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: xcodebuild archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath /tmp/BooruGallery.xcarchive \
            -destination "generic/platform=iOS" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_NAME" \
            2>&1 | tee /tmp/archive.log | tail -80

      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>${CODE_SIGN_IDENTITY}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_UUID}</string>
              </dict>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          cat ios/ExportOptions.plist

      - name: Export IPA
        run: |
          set -o pipefail
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/BooruGallery.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            2>&1 | tee /tmp/export.log | tail -30
          find build/ios/ipa -name "*.ipa" -ls

      - name: Rename IPA
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          find build/ios/ipa -name "*.ipa" | while read f; do
            mv "$f" "build/ios/ipa/BooruGallery_${{ github.ref_name }}_${SHA}.ipa"
          done
          ls -lh build/ios/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooruGallery-IPA-${{ github.ref_name }}-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /tmp/archive.log
            /tmp/export.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          rm -f /tmp/cert.p12 /tmp/cert_and_key.pem /tmp/cert_final.p12 /tmp/profile.mobileprovision

      - name: Build summary
        if: success()
        run: |
          echo "## ✅ IPA Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | \`${BUNDLE_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Team | ${CODE_SIGN_IDENTITY} |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | Ad Hoc |" >> $GITHUB_STEP_SUMMARY
